; PlatformIO project for the Seeed XIAO ESP32-S3 camera device.
; Board/camera variant must be physically verified before flashing.

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_deps =
  bblanchon/ArduinoJson@^7.0.4

build_flags =
  -D SERVER_PATH=\"/api/frame\"
  -D DEVICE_ID=\"esp32-kitchen-cam\"
