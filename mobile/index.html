<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen Mobile Camera Mapper</title>
  <style>
    :root { --bg:#020617; --panel:#111827; --text:#f8fafc; --muted:#94a3b8; --line:#334155; --green:#22c55e; --yellow:#eab308; --red:#ef4444; --blue:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Segoe UI, Arial, sans-serif; }
    header { padding:16px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:24px; }
    main { padding:14px; display:grid; gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
    video, canvas, img { width:100%; border-radius:12px; background:#000; border:1px solid #1e293b; }
    .video-frame { position:relative; width:100%; aspect-ratio:16 / 9; overflow:hidden; border-radius:12px; background:#000; }
    video { width:100%; height:100%; aspect-ratio:16 / 9; object-fit:contain; }
    button, select { font:inherit; border-radius:10px; border:1px solid var(--line); padding:12px; }
    button { background:#2563eb; color:white; font-weight:700; cursor:pointer; }
    button.secondary { background:#334155; }
    button.danger { background:#dc2626; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .status { color:var(--yellow); font-weight:700; }
    .ok { color:var(--green); } .bad { color:var(--red); }
    .muted { color:var(--muted); }
    code { background:#020617; padding:2px 5px; border-radius:6px; }
    .alt { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:12px; margin:10px 0; }
    .alt a { color:#38bdf8; }
  </style>
</head>
<body>
  <header>
    <h1>Mobile Kitchen Mapper</h1>
    <p class="muted">Use phone camera for high-quality local mapping frames. Frames are sent to this laptop server.</p>
  </header>
  <main id="app">
    <p class="muted" style="text-align:center">Checking camera support...</p>
  </main>

<script>
// Determine API base - same host, port 8000 (HTTP server for frame upload)
const hostname = location.hostname;
// HTTPS mobile page posts to its own HTTPS server. HTTP page posts to port 8000.
const apiBase = location.protocol === 'https:' ? '' : `http://${hostname}:8000`;

// Check if we can use camera API
const isSecure = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

function showApp() {
  document.getElementById('app').innerHTML = `
    <section class="card">
      <div class="video-frame"><video id="video" autoplay playsinline muted></video></div>
      <canvas id="canvas" style="display:none"></canvas>
    </section>
    <section class="card">
      <div class="row">
        <button onclick="startCamera()">Start Camera</button>
        <button class="secondary" onclick="switchCamera()">Switch Camera</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="captureAndSend()">Capture Mapping Frame</button>
        <button id="autoBtn" class="secondary" onclick="toggleAuto()">Auto Send: Off</button>
      </div>
      <p>Status: <span id="status" class="status">not started</span></p>
      <p id="orientationHint" class="muted">Hold the phone sideways (landscape) for a wide kitchen view that fills the dashboard.</p>
      <p class="muted">Open dashboard on laptop: <code>/dashboard/</code>. Select Mobile source to see this feed.</p>
    </section>
    <section class="card">
      <h2>Mapping instructions</h2>
      <ol>
        <li>Stand still and point camera clearly at one kitchen zone.</li>
        <li>Capture: glass/cupboard, kettle, sugar/tea/coffee, spoons/utensils, water/sink.</li>
        <li>Move slowly. Avoid blur and glare.</li>
        <li>Use these frames later for graph building / VLM analysis.</li>
      </ol>
    </section>
  `;
  loadCameraApp();
}

function showHelp() {
  const httpsUrl = `https://${hostname}:8443/mobile/`;
  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align:center">
      <h2>📱 Camera Access</h2>
      <p>This page uses your phone's camera for kitchen mapping.</p>
      <p class="muted">You are on <code>${location.protocol}//${location.host}</code></p>
      
      <div class="alt">
        <strong>Option 1: Trust laptop certificate, then use HTTPS</strong><br>
        <a href="${apiBase}/mobile-ca.crt">Download laptop certificate</a><br>
        <small>Install it on Android as a CA certificate, then open:</small><br>
        <a href="${httpsUrl}" target="_blank">${httpsUrl}</a>
      </div>
      
      <div class="alt">
        <strong>Option 2: Use IP Webcam app (recommended)</strong><br>
        <ol style="text-align:left">
          <li>Install <em>IP Webcam</em> on Android</li>
          <li>Start server in app</li>
          <li>Open dashboard on laptop → Select Mobile source</li>
        </ol>
      </div>
      
      <div class="alt">
        <strong>Option 3: Try camera anyway</strong><br>
        Some phones allow camera on HTTP for local IPs.
        <button onclick="tryCameraAnyway()" style="margin-top:8px">Try Camera</button>
      </div>
    </div>
  `;
}

function tryCameraAnyway() {
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then(stream => {
      stream.getTracks().forEach(t => t.stop());
      showApp();
    })
    .catch(err => {
      alert('Camera not allowed: ' + err.message);
    });
}

function showNativeCameraFallback() {
  document.getElementById('app').innerHTML = `
    <section class="card">
      <h2>📷 Use Phone Camera</h2>
      <p>Live browser preview is blocked on this HTTP address, but your phone can still capture a high-quality image and send it to the laptop.</p>
      <input id="nativeCamera" type="file" accept="image/*" capture="environment" style="display:none" onchange="uploadNativePhoto(event)" />
      <button onclick="document.getElementById('nativeCamera').click()" style="width:100%">Open Phone Camera</button>
      <p id="nativeStatus" class="status">No photo captured yet.</p>
    </section>
    <section class="card">
      <h2>Live preview option</h2>
      <p>For live preview, use Chrome over HTTPS:</p>
      <p><code>https://${hostname}:8443/mobile/</code></p>
      <p class="muted">The native camera option above is recommended for mapping because it works without HTTPS and sends full-quality still images.</p>
    </section>
  `;
}

async function uploadNativePhoto(event) {
  const file = event.target.files && event.target.files[0];
  const status = document.getElementById('nativeStatus');
  if (!file) return;
  status.textContent = 'Uploading photo...';
  try {
    const res = await fetch(`${apiBase}/api/mobile/frame`, {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'image/jpeg', 'X-Device-Id': 'phone-native-camera', 'X-Capture-Millis': String(Date.now()) },
      body: file
    });
    const data = await res.json();
    status.textContent = `Uploaded frame ${data.frame_id} (${data.size_bytes} bytes)`;
    status.className = 'ok';
  } catch (err) {
    status.textContent = 'Upload failed: ' + err;
    status.className = 'bad';
  }
  event.target.value = '';
}

// Initial check
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  showNativeCameraFallback();
} else if (isSecure) {
  showApp();
} else {
  // Try to access camera - some browsers allow it on local IPs
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(stream => {
      stream.getTracks().forEach(t => t.stop());
      showApp();
    })
    .catch(err => {
      showNativeCameraFallback();
    });
}

function loadCameraApp() {
  let stream = null;
  let facingMode = 'environment';
  let autoTimer = null;
  let frameCount = 0;
  let liveSocket = null;
  let captureBusy = false;

  // ---------------- physical orientation ----------------
  // With auto-rotate locked, a sideways phone still delivers portrait frames with the
  // scene turned 90 degrees. The motion sensor tells us how the phone is really held,
  // so we can tell the dashboard (and the AI frame encoder) how to turn it upright.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  let physicalRotate = 0;  // clockwise degrees needed to make a portrait frame upright
  let motionStarted = false;

  function frameRotation() {
    const v = document.getElementById('video');
    if (!v || !v.videoWidth) return 0;
    if (v.videoWidth > v.videoHeight) return 0;  // browser already rotated it (auto-rotate on)
    return physicalRotate;
  }

  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || g.y == null) return;
    let x = g.x, y = g.y;
    if (isIOS) { x = -x; y = -y; }  // iOS reports the opposite sign
    let r = physicalRotate;
    if (Math.abs(x) > 6 && Math.abs(x) > Math.abs(y) + 2) r = x > 0 ? -90 : 90;
    else if (Math.abs(y) > 6 && Math.abs(y) > Math.abs(x) + 2) r = 0;
    if (r !== physicalRotate) { physicalRotate = r; broadcastOrientation(); updateHint(); }
  }

  async function startMotion() {
    if (motionStarted || !window.DeviceMotionEvent) return;
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        if (await DeviceMotionEvent.requestPermission() !== 'granted') return;
      }
      window.addEventListener('devicemotion', onMotion);
      motionStarted = true;
    } catch (e) {}
  }

  function broadcastOrientation() {
    const rotate = frameRotation();
    peers.forEach((_, id) => signalSend({ type: 'orientation', to: id, rotate }));
  }

  function updateHint() {
    const video = document.getElementById('video');
    const hint = document.getElementById('orientationHint');
    if (!hint || !video || !video.videoWidth) return;
    const rot = frameRotation();
    const portraitFrame = video.videoHeight > video.videoWidth;
    if (portraitFrame && rot === 0) {
      hint.textContent = 'Phone is upright, so the dashboard gets a tall picture. Turn the phone sideways for a full-width 16:9 view.';
      hint.className = 'status';
    } else {
      hint.textContent = rot ? 'Sideways phone detected. The dashboard turns the picture upright and shows it full width.'
                             : `Landscape view active (${video.videoWidth}x${video.videoHeight}). The dashboard shows the full 16:9 picture.`;
      hint.className = 'muted';
    }
  }

  function setStatus(text, cls='status') {
    const el = document.getElementById('status');
    if (el) { el.textContent = text; el.className = cls; }
  }

  // ---------------- WebRTC publisher (low-latency display path) ----------------
  // Video goes phone -> dashboard peer-to-peer over the LAN using the phone's
  // hardware encoder. The server only relays signaling messages.
  let signal = null;
  let signalChain = Promise.resolve();
  const peers = new Map();
  const wsBase = location.origin.replace('https:', 'wss:').replace('http:', 'ws:');

  function signalSend(msg) {
    if (signal && signal.readyState === WebSocket.OPEN) signal.send(JSON.stringify(msg));
  }

  function closePeer(id) {
    const pc = peers.get(id);
    if (pc) { try { pc.close(); } catch (e) {} peers.delete(id); }
  }

  function preferHardwareCodecs(transceiver) {
    if (!transceiver.setCodecPreferences || !window.RTCRtpSender || !RTCRtpSender.getCapabilities) return;
    const caps = RTCRtpSender.getCapabilities('video');
    if (!caps) return;
    const rank = c => {
      const m = c.mimeType.toLowerCase();
      if (m === 'video/h264') return 0;   // hardware encoder on nearly all phones
      if (m === 'video/vp8') return 1;
      if (m === 'video/vp9' || m === 'video/av1') return 2;
      return 3;                           // rtx / red / ulpfec keep working
    };
    try { transceiver.setCodecPreferences([...caps.codecs].sort((a, b) => rank(a) - rank(b))); } catch (e) {}
  }

  async function tuneSender(sender) {
    try {
      const p = sender.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = 2500000;     // ~2.5 Mbps is plenty for 720p30 on LAN
      p.encodings[0].maxFramerate = 30;
      p.encodings[0].priority = 'high';
      p.encodings[0].networkPriority = 'high';
      p.degradationPreference = 'maintain-framerate'; // smooth motion > sharpness
      await sender.setParameters(p);
    } catch (e) {}
  }

  async function offerTo(viewerId) {
    if (!stream) return;
    closePeer(viewerId);
    const pc = new RTCPeerConnection({ iceServers: [] }); // same LAN: host candidates only
    peers.set(viewerId, pc);
    const track = stream.getVideoTracks()[0];
    try { track.contentHint = 'motion'; } catch (e) {}
    const tx = pc.addTransceiver(track, { direction: 'sendonly', streams: [stream] });
    preferHardwareCodecs(tx);
    pc.onicecandidate = e => signalSend({ type: 'candidate', to: viewerId, candidate: e.candidate });
    pc.onconnectionstatechange = () => {
      const st = pc.connectionState;
      if (st === 'connected') signalSend({ type: 'orientation', to: viewerId, rotate: frameRotation() });
      if (st === 'connected') setStatus(`WebRTC live to dashboard (${peers.size} viewer${peers.size === 1 ? '' : 's'})`, 'ok');
      if (st === 'failed') { setStatus('WebRTC failed; dashboard will use JPEG fallback', 'bad'); closePeer(viewerId); }
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await tuneSender(tx.sender);
    signalSend({ type: 'offer', to: viewerId, sdp: pc.localDescription });
  }

  async function handleSignal(msg) {
    const pc = peers.get(msg.from);
    if (msg.type === 'viewer-joined') await offerTo(msg.from);
    else if (msg.type === 'answer' && pc) await pc.setRemoteDescription(msg.sdp);
    else if (msg.type === 'candidate' && pc && msg.candidate) await pc.addIceCandidate(msg.candidate).catch(() => {});
    else if (msg.type === 'viewer-left') closePeer(msg.from);
  }

  function startRtcPublisher() {
    if (!window.RTCPeerConnection) return;
    if (signal && signal.readyState <= 1) {
      // Camera switched: hot-swap the track on every live connection, no renegotiation.
      const track = stream.getVideoTracks()[0];
      peers.forEach(pc => pc.getSenders().forEach(s => s.replaceTrack(track).catch(() => {})));
      return;
    }
    signal = new WebSocket(`${wsBase}/ws/signal?role=publisher`);
    signal.onmessage = ev => {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      signalChain = signalChain.then(() => handleSignal(msg)).catch(() => {});
    };
    signal.onclose = () => {
      peers.forEach((_, id) => closePeer(id));
      signal = null;
      if (stream) setTimeout(startRtcPublisher, 1500);
    };
  }

  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      // 720p30: lowest encode latency with good detail. 1080p doubles encoder work.
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 30 } },
        audio: false
      });
      const video = document.getElementById('video');
      video.srcObject = stream;
      await video.play();
      startMotion();
      updateHint();
      video.onresize = () => { updateHint(); broadcastOrientation(); };
      setStatus('camera started; connecting WebRTC...', 'ok');
      startRtcPublisher();
      connectLiveSocket();
      startLiveSend();
    } catch (err) {
      setStatus('camera failed: ' + err, 'bad');
    }
  }

  async function switchCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    await startCamera();
  }

  function canvasBlob(canvas, quality=0.86) {
    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
  }

  function connectLiveSocket() {
    if (liveSocket && liveSocket.readyState <= 1) return;
    liveSocket = new WebSocket(`${location.origin.replace('https:', 'wss:').replace('http:', 'ws:')}/ws/mobile`);
    liveSocket.binaryType = 'blob';
    liveSocket.onopen = () => { if (!peers.size) setStatus('AI frame link connected', 'ok'); };
    liveSocket.onerror = () => setStatus('live connection error', 'bad');
    liveSocket.onclose = () => { if (autoTimer) setStatus('live connection closed', 'bad'); };
  }

  async function captureAndSend() {
    if (captureBusy) return;
    const video = document.getElementById('video');
    if (!video.videoWidth) { setStatus('start camera first', 'bad'); return; }
    captureBusy = true;
    const canvas = document.getElementById('canvas');
    // AI frame: the camera picture exactly as seen (upright), longest side capped at 1280 px.
    // No rotation and no black bars, so the vision model sees the real scene orientation.
    const scale = Math.min(1, 1280 / Math.max(video.videoWidth, video.videoHeight));
    const w = Math.round(video.videoWidth * scale);
    const h = Math.round(video.videoHeight * scale);
    const rot = frameRotation();
    canvas.width = rot ? h : w;
    canvas.height = rot ? w : h;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (rot) {
      // Sideways phone with auto-rotate locked: turn the frame upright for the AI.
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(rot * Math.PI / 180);
      ctx.drawImage(video, -w / 2, -h / 2, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(video, 0, 0, w, h);
    }
    const blob = await canvasBlob(canvas, 0.82);
    try {
      if (liveSocket && liveSocket.readyState === WebSocket.OPEN) {
        // Don't enqueue stale frames in the browser's socket buffer.
        if (liveSocket.bufferedAmount > 512 * 1024) {
          setStatus('network busy; dropping stale frame', 'status');
          captureBusy = false;
          return;
        }
        liveSocket.send(blob);
        frameCount++;
        if (!peers.size) setStatus(`AI frame ${frameCount} sent`, 'ok');
        captureBusy = false;
        return;
      }
      const res = await fetch(`${apiBase}/api/mobile/frame`, {
        method: 'POST',
        headers: { 'Content-Type': 'image/jpeg', 'X-Device-Id': 'phone-mapper', 'X-Capture-Millis': String(Date.now()) },
        body: blob
      });
      const data = await res.json();
      frameCount++;
      setStatus(`sent frame ${data.frame_id}, ${data.size_bytes} bytes`, 'ok');
    } catch (err) { setStatus('send failed: ' + err, 'bad'); }
    captureBusy = false;
  }

  function startLiveSend() {
    const btn = document.getElementById('autoBtn');
    if (autoTimer) return;
    // JPEG frames now only feed the AI/VLM (2 FPS). Smooth display goes over WebRTC.
    autoTimer = setInterval(captureAndSend, 500);
    if (btn) { btn.textContent = 'AI Frames: On'; btn.className = 'danger'; }
    captureAndSend();
  }

  function toggleAuto() {
    const btn = document.getElementById('autoBtn');
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; btn.textContent = 'AI Frames: Off'; btn.className = 'secondary'; setStatus('live send stopped', 'status'); }
    else { startLiveSend(); }
  }

  // The buttons use inline onclick handlers, so expose the functions globally.
  window.startCamera = startCamera;
  window.switchCamera = switchCamera;
  window.captureAndSend = captureAndSend;
  window.toggleAuto = toggleAuto;
}
</script>
</body>
</html>
